<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <title>Battle Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="battle-log.css">
</head>
<body>
<div id="app">

  <div id="header">
    <span id="header-label">⚔ BATTLE LOG</span>
    <div id="header-actions">
      <button id="btn-clear-all">🗑 CLEAR ALL</button>
      <button id="btn-close">✕</button>
    </div>
  </div>

  <div id="log-list">
    <div id="empty-state">No games recorded yet.<br>Post-game analysis will be saved here automatically.</div>
  </div>

</div>
<script src="battle-log.js"></script>
</body>
</html>
