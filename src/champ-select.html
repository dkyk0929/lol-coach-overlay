<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://raw.communitydragon.org https://ddragon.leagueoflegends.com data:">
  <title>Champ Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="champ-select.css">
</head>
<body>
<div id="app">

  <div id="header">
    <span id="role-label">CHAMP SELECT</span>
    <span id="bans-label"></span>
  </div>

  <div id="teams">
    <div id="ally-team" class="team-col">
      <div class="team-header">ALLIES</div>
      <div id="ally-list"></div>
    </div>
    <div id="divider"></div>
    <div id="enemy-team" class="team-col">
      <div class="team-header">ENEMIES</div>
      <div id="enemy-list"></div>
    </div>
  </div>

  <div id="ai-section">
    <div id="ai-label">✦ AI RECOMMENDS</div>
    <div id="ai-content">Waiting for picks...</div>
    <div id="ai-cards"></div>
  </div>

</div>
<script src="champ-select.js"></script>
</body>
</html>
