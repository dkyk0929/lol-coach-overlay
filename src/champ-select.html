<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://raw.communitydragon.org https://ddragon.leagueoflegends.com data:">
  <title>Champ Select</title>
  <link rel="stylesheet" href="champ-select.css">
</head>
<body>
<div id="app">

  <div id="header">
    <span id="role-label">CHAMP SELECT</span>
    <span id="bans-label"></span>
  </div>

  <div id="teams">
    <div id="ally-team" class="team-col">
      <div class="team-header">ALLIES</div>
      <div id="ally-list"></div>
    </div>
    <div id="divider"></div>
    <div id="enemy-team" class="team-col">
      <div class="team-header">ENEMIES</div>
      <div id="enemy-list"></div>
    </div>
  </div>

  <div id="build-section" class="hidden">

    <div id="build-header">
      <span id="build-source">BUILD  ·  Lolalytics · Platinum+</span>
      <div id="build-toggle">
        <button id="btn-most-used" class="toggle-btn active">Most Played</button>
        <button id="btn-most-won"  class="toggle-btn">Highest WR</button>
      </div>
    </div>

    <div id="build-status">Fetching build data...</div>

    <div id="build-content" class="hidden">
      <div id="build-cols">

        <!-- Left: runes -->
        <div id="build-rune-col">
          <p class="col-label">RUNES</p>
          <div id="build-rune-row">
            <img id="build-keystone-icon" src="" alt="">
            <div id="build-rune-text">
              <span id="build-keystone-name"></span>
              <span id="build-rune-trees"></span>
            </div>
          </div>
          <div id="build-rune-stats"></div>
        </div>

        <div id="build-divider"></div>

        <!-- Right: items -->
        <div id="build-item-col">
          <p class="col-label">CORE BUILD</p>
          <div id="build-item-icons"></div>
          <div id="build-item-names"></div>
        </div>

      </div>

    </div>

  </div>

  <div id="ai-section">
    <div id="ai-content">Waiting for picks...</div>
  </div>

</div>
<script src="champ-select.js"></script>
</body>
</html>
