<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <title>Rift SensAI Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="control-panel.css">
</head>
<body>
<div id="app">

  <div id="header">
    <span id="title">✦ RIFT SENS<span class="ai-accent">AI</span></span>
    <span id="hint">CTRL+SHIFT+C TO CLOSE</span>
    <button id="close-btn" title="Close panel">✕</button>
  </div>

  <div id="buttons">

    <div class="btn-group">
      <button id="tts-btn" class="btn-action">🔊 VOICE ON</button>
    </div>

    <div class="btn-group">
      <button id="log-btn"    class="btn-secondary">📋 LOG</button>
      <button id="ai-btn"     class="btn-secondary">✦ AI</button>
      <button id="coffee-btn" class="btn-secondary">☕</button>
    </div>


  </div>

</div>
<script src="control-panel.js"></script>
</body>
</html>
