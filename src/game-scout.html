<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://raw.communitydragon.org data:">
  <title>Match Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game-scout.css">
</head>
<body>
<div id="app">

  <div id="header">
    <span id="header-label">MATCH SCOUT</span>
    <button id="btn-close">✕</button>
  </div>

  <div id="body">
    <div class="team-header ally-header">▲ ALLIES</div>
    <div id="ally-grid" class="team-grid"></div>

    <div class="team-header enemy-header">▲ ENEMIES</div>
    <div id="enemy-grid" class="team-grid"></div>
  </div>

  <div id="match-tooltip" class="hidden"></div>

</div>
<script src="game-scout.js"></script>
</body>
</html>
