<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
  <title>Rift SensAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ── Left action strip — Log · AI · Coffee · Info ── -->
  <div id="left-actions">
    <button id="btn-log"    title="Battle Log">📋</button>
    <button id="btn-ai"     title="AI Coaching">✦</button>
    <button id="btn-coffee" title="Buy me a coffee ☕">☕</button>
    <button id="btn-info"   title="Info & Links">ℹ️</button>
  </div>

  <!-- ── Right panel — window controls + util ── -->
  <div id="right-panel">
    <div id="win-controls">
      <button id="btn-minimize" title="Minimize">−</button>
      <button id="btn-close"    title="Quit Rift SensAI">✕</button>
    </div>
    <div class="panel-sep"></div>
    <div id="util-grid">
      <button id="btn-tts"     title="Mute / Unmute voice">🔊</button>
      <button id="btn-opacity" title="Opacity control">85%</button>
      <button id="btn-dashboard-mode" class="hidden" title="Switch to Dashboard Mode">🖥</button>
    </div>
  </div>

  <!-- ── Opacity panel ── -->
  <div id="opacity-panel" class="hidden">
    <span class="opacity-label">OPACITY</span>
    <input type="range" id="opacity-slider" min="20" max="100" value="85" step="1">
    <span id="opacity-value">85%</span>
  </div>

  <!-- ── Waiting state ── -->
  <div id="waiting-screen">
    <span class="waiting-icon">⚔</span>
    <div class="waiting-brand">
      <span class="waiting-title">RIFT SENS<span class="ai-accent">AI</span></span>
      <span class="waiting-version"></span>
    </div>
    <span class="waiting-sub">Waiting for a match · Borderless Windowed</span>
  </div>

  <!-- ── Game HUD bar ── -->
  <div id="game-screen" class="hidden">
    <div id="game-bar">

      <!-- JG zone — leftmost anchor in-game -->
      <div id="jg-zone">
        <span id="jg-threat">●</span>
        <span id="jg-last">detecting...</span>
      </div>

      <div class="bar-divider"></div>

      <!-- CS + Gold zone -->
      <div id="cs-zone">
        <span id="cs-delta">—</span>
        <span id="wave-trend"></span>
        <span id="gold-diff"></span>
      </div>

      <div class="bar-divider"></div>

      <!-- Drake zone -->
      <div id="drake-zone">
        <span id="drake-icon">🐉</span>
        <span id="ally-drakes">0</span>
        <span id="drake-sep" class="drake-sep">·</span>
        <span id="enemy-drakes">0</span>
        <span id="obj-countdown"></span>
      </div>

      <div class="bar-divider"></div>

      <!-- Coaching zone -->
      <div id="coaching-zone">
        <div id="focus-text">Warming up...</div>
      </div>

      <!-- Situational context badge -->
      <div id="allin-badge" class="hidden"></div>

      <!-- Back to lobby (shown after game ends) -->
      <button id="back-btn" class="hidden" title="Back to waiting screen">←</button>

    </div>
  </div>

</div>

  <div id="dashboard-screen" class="hidden">
    <div id="dashboard-active">
      <div class="dash-stats-row">
        <div id="dash-obj-panel" class="dash-panel">
          <span id="dash-jg-threat">●</span>
          <span id="dash-jg-last">detecting...</span>
          <span id="dash-sep-1" class="dash-sep">|</span>
          <span id="dash-drake-group">
            <span id="dash-drake-icon">🐉</span>
            <span id="dash-ally-drakes">0</span>
            <span id="dash-drake-sep" class="dash-sep">·</span>
            <span id="dash-enemy-drakes">0</span>
          </span>
          <span id="dash-sep-2" class="dash-sep">|</span>
          <span id="dash-obj-countdown"></span>
        </div>
        <div id="dash-cs-panel" class="dash-panel">
          <span id="dash-cs-delta">—</span>
          <span id="dash-wave-trend"></span>
          <span class="dash-sep">|</span>
          <span id="dash-gold-diff"></span>
        </div>
      </div>
      <div id="dash-focus-panel" class="dash-panel">
        <div id="dash-focus-text">Warming up...</div>
      </div>
      <div id="dash-allin-badge" class="dash-panel hidden"></div>
      <div id="dash-feed-panel" class="dash-panel">
        <div id="dash-feed-list"></div>
      </div>
    </div>
    <div id="dashboard-controls">
      <label><input type="checkbox" id="dash-widget-feed" checked> Feed</label>
      <label><input type="checkbox" id="dash-widget-objectives" checked> Objectives</label>
      <label><input type="checkbox" id="dash-widget-csgold" checked> CS/Gold</label>
      <button id="dash-btn-log" title="Battle Log">📋 LOG</button>
      <button id="dash-btn-ai" title="Set up AI Coaching">✦ AI</button>
      <button id="dash-btn-info" title="Info & Links">ℹ️ INFO</button>
      <button id="dash-btn-tts">🔊 VOICE ON</button>
      <button id="dash-btn-back">← Back to overlay</button>
    </div>
  </div>

<script src="data/timeline.js"></script>
<script src="data/eventHandlers.js"></script>
<script src="renderer.js"></script>
</body>
</html>
